<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявку прийнято! | SvitloRent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-8 text-center">
        <!-- Success Icon -->
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-check text-4xl text-green-500"></i>
        </div>

        <h1 class="text-2xl font-extrabold text-slate-800 mb-2">Дякуємо, заявку отримано!</h1>
        
        <p class="text-slate-500 mb-6 leading-relaxed">
            Ми зв'яжемося з вами протягом <span class="font-bold text-slate-800">15 хвилин</span> для підтвердження наявності станції.
        </p>

        <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-8 text-left">
            <p class="text-sm text-blue-800 flex items-start gap-2">
                <i class="fas fa-info-circle mt-1"></i>
                <span>
                    <strong>Робочий час:</strong> 09:00 – 21:00.<br>
                    Якщо ви залишили заявку вночі, ми зателефонуємо вам завтра вранці у першу чергу.
                </span>
            </p>
        </div>

        <a href="/" class="block w-full bg-yellow-500 text-slate-900 font-bold py-3 rounded-xl hover:bg-yellow-400 transition shadow-lg shadow-yellow-200">
            Повернутися на головну
        </a>
    </div>

</body>
</html>

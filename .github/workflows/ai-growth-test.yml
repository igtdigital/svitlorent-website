
name: AI Growth - Agent V1

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/680620652958/locations/global/workloadIdentityPools/ai-growth-github/providers/github-actions'
          service_account: 'ai-growth-gsc@svitlorent-ai-growth.iam.gserviceaccount.com'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI Growth dependencies
        run: pip install 'openai>=1.0,<3' google-auth requests

      
      - name: Test Google Search Console API
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import google.auth
          from google.auth.transport.requests import AuthorizedSession

          credentials, project = google.auth.default(
              scopes=[
                  "https://www.googleapis.com/auth/webmasters.readonly"
              ]
          )

          session = AuthorizedSession(credentials)

          response = session.get(
              "https://www.googleapis.com/webmasters/v3/sites",
              timeout=30
          )
          response.raise_for_status()

          data = response.json()
          sites = data.get("siteEntry", [])

          result = {
              "status": "success",
              "accessible_sites": [
                  {
                      "siteUrl": site.get("siteUrl"),
                      "permissionLevel": site.get("permissionLevel")
                  }
                  for site in sites
              ]
          }

          Path("gsc-test-result.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Upload GSC test result
        uses: actions/upload-artifact@v4
        with:
          name: gsc-test-result
          path: gsc-test-result.json
          retention-days: 7

      - name: Run AI Growth Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openai import OpenAI

          client = OpenAI(timeout=30, max_retries=1)

          response = client.responses.create(
              model="gpt-4.1-mini",
              max_output_tokens=500,
              instructions=(
                  "You are the AI Growth Orchestrator "
                  "for SvitloRent, a power station rental "
                  "business in Kyiv, Ukraine. "
                  "Your first priority is organic search "
                  "and AI search visibility. Google Ads "
                  "is a future module of the same system. "
                  "Do not invent analytics or performance data."
              ),
              input=(
                  "Return a short JSON object with keys: "
                  "agent, status, priority, next_integration. "
                  "This is a connectivity test, not an SEO audit."
              )
          )

          output = response.output_text
          Path("ai-growth-result.json").write_text(
              output, encoding="utf-8"
          )
          print("OpenAI response received")
          print("Result saved to ai-growth-result.json")
          PY

      - name: Upload agent result
        uses: actions/upload-artifact@v4
        with:
          name: ai-growth-result
          path: ai-growth-result.json
          retention-days: 7
